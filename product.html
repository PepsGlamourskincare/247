<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Product - Peps Glamour Skincare</title>
<link rel="icon" type="image/jpg" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green: #28b463; --text: #2c3e50; --light-green: #eaf1; --white: #fff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', Arial, sans-serif; }
  body { background: var(--white); color: var(--text); line-height: 1.6; }
  header { background: var(--green); color: var(--white); padding: 20px; text-align: center; }
  header a { color: var(--white); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  header h1 { font-size: 24px; }
  .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
  .product { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
  .product img { width: 100%; border-radius: 15px; object-fit: cover; }
  .product h2 { color: var(--green); font-size: 32px; margin-bottom: 10px; }
  .product p { line-height: 1.7; margin-bottom: 20px; font-size: 16px; }
  .btn-group { display: flex; gap: 15px; flex-wrap: wrap; }
  .btn { padding: 14px 28px; border-radius: 25px; text-decoration: none; font-weight: 600; display: inline-block; transition: 0.3s; border: none; cursor: pointer; font-size: 16px; }
  .btn-green { background: var(--green); color: var(--white); }
  .btn-whatsapp { background: #25D366; color: var(--white); }
  .btn:hover { transform: scale(1.05); }
  .contact-form { background: var(--light-green); padding: 30px; border-radius: 15px; margin-top: 40px; display: none; }
  .contact-form.show { display: block; }
  .contact-form h3 { color: var(--green); margin-bottom: 15px; }
  .contact-form input, .contact-form textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: 'Poppins', sans-serif; }
  .contact-form input:focus, .contact-form textarea:focus { outline: none; border-color: var(--green); }
  .loading { text-align: center; padding: 60px 20px; font-size: 18px; color: var(--green); }
  .error { text-align: center; padding: 60px 20px; }
  .error h2 { color: #e74c3c; margin-bottom: 15px; }
  @media (max-width: 768px) {
    .product { grid-template-columns: 1fr; }
    .product h2 { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html">← Back to Home</a>
  <h1>Peps Glamour Skincare</h1>
</header>

<div class="container" id="product-container">
  <div class="loading">Loading product...</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const productName = urlParams.get('name');

if (!productName) {
  document.getElementById('product-container').innerHTML = `
    <div class="error">
      <h2>Product not found</h2>
      <p>No product was selected. Go back to <a href="index.html" style="color:#28b463;">home</a>.</p>
    </div>
  `;
} else {
  fetch('config.json')
    .then(res => res.json())
    .then(data => {
      const product = data.products.items.find(p => p.name === productName);
      
      if (!product) {
        document.getElementById('product-container').innerHTML = `
          <div class="error">
            <h2>Product not found</h2>
            <p>We couldn't find "${productName}". Go back to <a href="index.html" style="color:#28b463;">home</a>.</p>
          </div>
        `;
        return;
      }

      document.getElementById('page-title').textContent = product.name + ' - Peps Glamour Skincare';
      
      const whatsappMsg = encodeURIComponent(`Hi Peps Glamour, I want to order ${product.name}`);
      const whatsappLink = `https://wa.me/${data.site.contact.whatsapp}?text=${whatsappMsg}`;

      document.getElementById('product-container').innerHTML = `
        <div class="product">
          <img src="${product.image}" alt="${product.name}">
          <div>
            <h2>${product.name}</h2>
            <p>${product.desc}</p>
            
            <div class="btn-group">
              <button class="btn btn-green" onclick="showForm()">Message Us</button>
              <a href="${whatsappLink}" class="btn btn-whatsapp" target="_blank">Chat on WhatsApp</a>
            </div>
          </div>
        </div>

        <div class="contact-form" id="contactForm">
          <h3>Send us a Message about ${product.name}</h3>
          <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="${data.site.contact.web3formsKey}">
            <input type="hidden" name="subject" value="${product.name} Inquiry">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn btn-green">Send Message</button>
          </form>
        </div>
      `;
    })
    .catch(err => {
      document.getElementById('product-container').innerHTML = `
        <div class="error">
          <h2>Error loading product</h2>
          <p>Please check your internet and try again.</p>
        </div>
      `;
      console.error('Error:', err);
    });
}

function showForm() {
  document.getElementById('contactForm').classList.add('show');
  document.getElementById('contactForm').scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
